name: HAMLET Referral Release Validation

on:
  pull_request:
    branches:
      - main
      - fix/referral-reward-lifecycle-attribution
    paths:
      - 'app/**'
      - 'components/**'
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.*'
      - '.github/workflows/referral-release-validation.yml'
  push:
    branches:
      - feat/locked-referrals-and-static-hero
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamlet-referral-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, unit/PGlite tests, production build and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Vitest and PGlite regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end suite
        run: npm run test:e2e

  database-tests:
    name: Isolated Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable Supabase stack
        run: supabase start
      - name: Apply migrations and run database tests
        run: supabase test db
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup

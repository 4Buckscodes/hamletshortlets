name: Generate HAMLET Mobile Lockfile

on:
  push:
    branches:
      - feat/hamlet-expo-mobile-app
    paths:
      - ".github/workflows/generate-mobile-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: hamlet-mobile-lockfile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/hamlet-expo-mobile-app
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from the actual mobile manifest
        working-directory: apps/mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to the mobile feature branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'apps/mobile/package-lock.json';
            const content = fs.readFileSync(path).toString('base64');
            const branch = 'feat/hamlet-expo-mobile-app';
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore(mobile): add npm lockfile',
              content,
              branch,
              ...(sha ? { sha } : {})
            });

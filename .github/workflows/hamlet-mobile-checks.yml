name: HAMLET Mobile Checks

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/hamlet-mobile-checks.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Expo dependency validation
        run: npx expo-doctor
      - name: TypeScript validation
        run: npx tsc --noEmit

name: HAMLET Security and Regression Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/authentication-hardening]

permissions:
  contents: read

concurrency:
  group: hamlet-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit, database, build and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Unit and database regression tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

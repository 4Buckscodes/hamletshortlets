name: HAMLET CI

on:
  push:
    branches:
      - main
      - feat/nextjs-mobile-first-rebuild
      - security/authentication-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: hamlet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test and build Next.js MVP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve compatible dependency security updates
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit compatible security lockfile updates
        if: github.head_ref == 'security/authentication-hardening' || github.ref_name == 'security/authentication-hardening'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): update patched security lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
      - name: Upload resolved security lockfile
        uses: actions/upload-artifact@v4
        with:
          name: hamlet-security-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Install dependencies cleanly from lockfile
        run: npm ci
      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report = require("./npm-audit.json"); const vulns = report.vulnerabilities || {}; console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(vulns)) console.log(JSON.stringify({ name, severity: item.severity, direct: item.isDirect, range: item.range, via: item.via, fixAvailable: item.fixAvailable }));'
      - name: Run linter
        run: npm run lint
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Run unit and PGlite database tests
        run: npm test
      - name: Build Next.js production application
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop Playwright E2E suite
        run: npm run test:e2e

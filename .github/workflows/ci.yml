name: HAMLET CI

on:
  push:
    branches:
      - main
      - feat/nextjs-mobile-first-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hamlet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test and build Next.js MVP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies cleanly from lockfile
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Run unit and PGlite database tests
        run: npm test
      - name: Build Next.js production application
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop Playwright E2E suite
        run: npm run test:e2e

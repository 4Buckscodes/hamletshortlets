name: HAMLET CI

on:
  push:
    branches:
      - main
      - feat/nextjs-mobile-first-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hamlet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Next.js application
        run: npm run build
